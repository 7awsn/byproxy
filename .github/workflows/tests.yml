name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      # Roda a suíte em várias versões suportadas do Python.
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Instala o pacote com as dependências de desenvolvimento e roda os testes.
      - run: pip install -e ".[dev]"
      - run: pytest -q
